name: 正式发布安卓

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '打包配置（preview=测试 APK，production=正式 AAB）'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      version:
        description: '版本号（留空自动递增，例如 1.0.89）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Android ${{ inputs.profile }}（GitHub 构建）
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 1
          submodules: false

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        working-directory: student-app
        run: npm ci --legacy-peer-deps

      - name: 🌍 Create .env
        working-directory: student-app
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$SUPABASE_URL" > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .env

      - name: 🎯 Set version and Android version code
        id: vars
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          VERSION="$REQUESTED_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -e "
              const fs = require('fs');
              const current = JSON.parse(fs.readFileSync('student-app/app.json', 'utf8')).expo.version;
              if (!/^\\d+(\\.\\d+)+$/.test(current)) process.exit(1);
              const parts = current.split('.').map(Number);
              while (parts.length < 3) parts.push(0);
              parts[parts.length - 1] += 1;
              console.log(parts.join('.'));
            ")
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Invalid version: $VERSION (expected 2 to 4 numeric components)" >&2
            exit 1
          fi

          # EAS keeps its production versionCode remotely; a version-based code
          # gives direct builds a stable, increasing Android identifier.
          VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const buildNumber = Number(process.env.BUILD_NUMBER || 0);
          const app = JSON.parse(fs.readFileSync('student-app/app.json', 'utf8'));
          const currentCode = Number(app.expo?.android?.versionCode || 0);
          const semanticCode = version.split('.').map(Number).reduce((total, part) => total * 1000 + part, 0);
          const versionCode = Math.max(currentCode + 1, semanticCode, buildNumber);
          if (!Number.isSafeInteger(versionCode) || versionCode < 1 || versionCode > 2100000000) {
            throw new Error(`Android versionCode is out of range: ${versionCode}`);
          }

          for (const file of ['student-app/app.json', 'student-app/package.json', 'student-app/package-lock.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (file.endsWith('app.json')) {
              json.expo.version = version;
              json.expo.android.versionCode = versionCode;
            }
            else json.version = version;
            if (file.endsWith('package-lock.json')) json.packages[''].version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nversion_code=${versionCode}\n`);
          console.log(`App version: ${version}`);
          console.log(`Android versionCode: ${versionCode}`);
          NODE

      - name: 🛠️ Build Android on GitHub Runner
        working-directory: student-app
        env:
          PROFILE: ${{ inputs.profile }}
          VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          EOF

          # Match the update channel selected by the existing EAS profiles.
          PROFILE="$PROFILE" node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo.updates.requestHeaders = { 'expo-channel-name': process.env.PROFILE };
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          NODE

          # The native Android project is generated on the runner, so the
          # ignored local android/ directory is never required in Git.
          CI=1 npx expo prebuild --platform android --clean --no-install

          STORE_FILE="$PWD/android/app/release.keystore"
          if [ "$PROFILE" = "production" ]; then
            if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || \
               [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || \
               [ -z "${ANDROID_KEY_ALIAS:-}" ] || \
               [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
              cat >&2 <<'MESSAGE'
          Production Android builds require these GitHub Actions secrets:
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_ALIAS
            ANDROID_KEY_PASSWORD
          Use the same upload keystore as the existing Android release.
          MESSAGE
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          elif [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
               [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
               [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
               [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            # If preview secrets are present, use them so a preview APK can
            # update an existing installation signed with the same key.
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            # A temporary key keeps preview builds installable without making
            # a production signing key mandatory for ordinary testing.
            STORE_PASSWORD='github-preview-only'
            KEY_ALIAS='github-preview'
            KEY_PASSWORD='github-preview-only'
            keytool -genkeypair -v \
              -keystore "$STORE_FILE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=GitHub Preview, OU=CI, O=博学, C=IT'
          fi

          # Expo's generated Gradle file varies slightly across SDK releases.
          # Normalize the release signing block and inject the selected code.
          VERSION_CODE="$VERSION_CODE" node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          const versionCode = Number(process.env.VERSION_CODE);
          let contents = fs.readFileSync(path, 'utf8');
          contents = contents.replace(/versionCode\s+\d+/, `versionCode ${versionCode}`);

          if (!contents.includes('MYAPP_UPLOAD_STORE_FILE')) {
            const buildTypesIndex = contents.indexOf('    buildTypes {');
            if (buildTypesIndex < 0) throw new Error('Could not locate Android buildTypes block.');
            const releaseSigning = `    signingConfigs {\n        release {\n            storeFile file(System.getenv('MYAPP_UPLOAD_STORE_FILE') ?: 'release.keystore')\n            storePassword System.getenv('MYAPP_UPLOAD_STORE_PASSWORD')\n            keyAlias System.getenv('MYAPP_UPLOAD_KEY_ALIAS')\n            keyPassword System.getenv('MYAPP_UPLOAD_KEY_PASSWORD')\n        }\n    }\n`;
            const signingConfigsIndex = contents.indexOf('    signingConfigs {');
            if (signingConfigsIndex >= 0 && signingConfigsIndex < buildTypesIndex) {
              const closingMarker = '\n    }\n    buildTypes {';
              const closingIndex = contents.indexOf(closingMarker, signingConfigsIndex);
              if (closingIndex < 0) throw new Error('Could not locate the end of Android signingConfigs block.');
              const nestedRelease = releaseSigning
                .replace(/^    signingConfigs \{\n/, '')
                .replace(/\n    \}\n$/, '\n');
              contents = contents.slice(0, closingIndex) + `\n${nestedRelease}` + contents.slice(closingIndex);
            } else {
              contents = contents.slice(0, buildTypesIndex) + releaseSigning + contents.slice(buildTypesIndex);
            }
          }

          const buildTypesIndex = contents.indexOf('    buildTypes {');
          if (buildTypesIndex < 0) throw new Error('Could not locate Android buildTypes block.');
          const before = contents.slice(0, buildTypesIndex);
          let buildTypes = contents.slice(buildTypesIndex);
          buildTypes = buildTypes.replace(
            /(buildTypes\s*\{[\s\S]*?release\s*\{\s*)signingConfig\s+signingConfigs\.debug/,
            '$1signingConfig signingConfigs.release',
          );
          if (!buildTypes.includes('signingConfig signingConfigs.release')) {
            buildTypes = buildTypes.replace(
              /(buildTypes\s*\{[\s\S]*?release\s*\{)/,
              '$1\n            signingConfig signingConfigs.release',
            );
          }
          fs.writeFileSync(path, before + buildTypes);
          NODE

          export MYAPP_UPLOAD_STORE_FILE='release.keystore'
          export MYAPP_UPLOAD_STORE_PASSWORD="$STORE_PASSWORD"
          export MYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS"
          export MYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"

          if [ "$PROFILE" = "production" ]; then
            android/gradlew --no-daemon --stacktrace -p android bundleRelease
            cp android/app/build/outputs/bundle/release/app-release.aab "boxue.aab"
          else
            android/gradlew --no-daemon --stacktrace -p android assembleRelease
            cp android/app/build/outputs/apk/release/app-release.apk "boxue.apk"
          fi

      - name: 📤 Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.profile }}-${{ steps.vars.outputs.version }}-build${{ github.run_number }}
          path: |
            student-app/boxue.apk
            student-app/boxue.aab
          if-no-files-found: error
          retention-days: 30

      - name: 💾 Persist selected app version
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'student-app/app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete app.expo.updates.requestHeaders;
          fs.writeFileSync(path, JSON.stringify(app, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add student-app/app.json student-app/package.json student-app/package-lock.json
          if git diff --cached --quiet; then
            echo 'Version files already contain the selected version.'
          else
            git commit -m "chore: set app version ${{ steps.vars.outputs.version }}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: 🚀 Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          # Keep Android-only releases on a separate tag namespace. The
          # existing cross-platform workflow listens to vX.Y.Z and would
          # otherwise start an additional EAS cloud build.
          TAG="android-v${VERSION}"
          if [ "$PROFILE" = "production" ]; then
            ASSET='student-app/boxue.aab'
          else
            ASSET='student-app/boxue.apk'
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "博学 Android v${VERSION}" \
              --notes "Android ${VERSION} built on GitHub Actions. APK is preview; AAB is production."
          fi
