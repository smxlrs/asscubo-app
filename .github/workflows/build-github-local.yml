name: GitHub Runner Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build Android on GitHub runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: student-app/package-lock.json

      - name: Install dependencies
        working-directory: student-app
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify Expo login
        working-directory: student-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Create app environment file
        working-directory: student-app
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Build Android on the GitHub runner
        working-directory: student-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: build-artifacts
        run: |
          eas build \
            --platform android \
            --profile ${{ inputs.profile }} \
            --local \
            --non-interactive

          ARTIFACT=$(find build-artifacts -type f \( -name "*.apk" -o -name "*.aab" \) -print -quit)
          if [ -z "$ARTIFACT" ]; then
            echo "No Android build artifact was created"
            exit 1
          fi

          if [[ "$ARTIFACT" == *.aab ]]; then
            cp "$ARTIFACT" github-runner-build.aab
          else
            cp "$ARTIFACT" github-runner-build.apk
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-runner-android-${{ inputs.profile }}-${{ github.run_number }}
          path: |
            student-app/github-runner-build.apk
            student-app/github-runner-build.aab
          if-no-files-found: error
          retention-days: 30
