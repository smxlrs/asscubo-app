name: GitHub Runner Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      version:
        description: Optional version name
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      platform: android
      profile: ${{ inputs.profile }}
      version: ${{ inputs.version }}
    secrets: inherit
